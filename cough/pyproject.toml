[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "psupr-proj"
version = "0.1.0"
description = "A small Python package with an executable script entry point."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
psupr-proj = "psupr_proj.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

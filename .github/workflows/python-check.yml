
name: Python checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax:
    name: Python syntax and unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify required source files
        working-directory: cough
        shell: bash
        run: |
          set -e

          for file in \
            src/psupr_proj/cli.py \
            src/psupr_proj/data.py \
            src/psupr_proj/split.py \
            tests/test_cli.py
          do
            if [ -f "$file" ]; then
              echo "FOUND: $file"
            else
              echo "ERROR: Missing $file"
              exit 1
            fi
          done

      - name: Install Python dependencies
        working-directory: cough
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            echo "NOTICE: requirements.txt not found"
          fi

          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          else
            echo "NOTICE: requirements-dev.txt not found"
          fi

          # Required by psupr_proj.split
          python -m pip install scikit-learn

          python -m pip check

      - name: Compile Python files
        working-directory: cough
        run: |
          python -m compileall -q src tests

      - name: Run unit tests
        working-directory: cough
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_*.py" \
            -v
